name: instagram-daily-post

on:
  schedule:
    - cron: "17 1 * * *"    # 予備（10:17 JST）。本命は cron-job.org からの workflow_dispatch。
                            # GitHubのscheduleは毎時0分が混み、4〜7時間遅れる（2026-10-02実測）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず画像とキャプションだけ作る"
        type: boolean
        default: false
      force:
        description: "今日すでに投稿済みでも投稿する"
        type: boolean
        default: false

concurrency:
  group: ig-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # cron-job.org と予備scheduleの両方から起動されるので、今日分が済んでいれば何もしない
      - name: already posted today?
        id: guard
        if: ${{ !inputs.force }}
        run: python guard.py post

      # 画像は先にコミット＆pushしておく（Instagramが raw URL を取りに来るため）
      - name: build images
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: python insta_post.py --dry-run
      - name: push images
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add images
          if ! git diff --cached --quiet; then
            git commit -m "images: $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi

      - name: post to instagram
        if: ${{ !inputs.dry_run && steps.guard.outputs.skip != 'true' }}
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          IMAGE_REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python insta_post.py

      - name: save state
        if: ${{ !inputs.dry_run && steps.guard.outputs.skip != 'true' }}
        run: |
          git add posted.json ig_token.enc || true
          if ! git diff --cached --quiet; then
            git commit -m "posted: $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
