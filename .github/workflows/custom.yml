name: instagram-custom-post

# 手作りの画像＋キャプションを1回だけ投稿する（custom_post.py）。手動起動のみ
on:
  workflow_dispatch:
    inputs:
      images:
        description: "topic_images/ 内の画像（カンマ区切り。2枚以上でカルーセル）"
        required: true
      caption:
        description: "topic_images/ 内のキャプションファイル"
        required: true

concurrency:
  group: ig-topic
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: post to instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          IMAGE_REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python custom_post.py --images "${{ inputs.images }}" --caption "${{ inputs.caption }}"

      - name: save state
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add custom_posted.json ig_token.enc || true
          if ! git diff --cached --quiet; then
            git commit -m "custom post: $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
